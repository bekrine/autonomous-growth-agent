services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_growth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_growth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_growth
      REDIS_URL: redis://redis:6379
      PORT: 4000
      STORAGE_LOCAL_DIR: /app/storage
    ports:
      - "4000:4000"
    volumes:
      # Generated media must survive restarts, and the worker writes assets
      # the API serves at /media — so both mount the same volume.
      - mediadata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  agent-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        WORKSPACE_NAME: "@agent/agent-worker"
        WORKSPACE_PATH: workers/agent-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_growth
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      # Shares the API's media volume: this worker writes generated assets,
      # the API serves them at /media.
      - mediadata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  publishing-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        WORKSPACE_NAME: "@agent/publishing-worker"
        WORKSPACE_PATH: workers/publishing-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_growth
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  analytics-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        WORKSPACE_NAME: "@agent/analytics-worker"
        WORKSPACE_PATH: workers/analytics-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_growth
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  mediadata:
